name: Deploy Cloudflare Pages
on:
  workflow_call:
    inputs:
      deployment-ref:
        description: Reviewed full commit SHA of this repository, matching the caller uses reference
        required: true
        type: string
      artifact-name:
        required: true
        type: string
      project-name:
        required: true
        type: string
      hostname:
        required: true
        type: string
      title:
        default: Application
        type: string
      preview-pr:
        default: ''
        type: string
      comment-marker:
        default: '<!-- cloudflare-pages-preview -->'
        type: string
      check-revision:
        description: Require artifact version.json to match the caller SHA
        default: true
        type: boolean
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
permissions:
  contents: read
  pull-requests: write
  deployments: write
jobs:
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cloudflare-${{ github.repository }}-${{ inputs.project-name }}
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PREVIEW_PR: ${{ inputs.preview-pr }}
      PAGES_PROJECT: ${{ inputs.project-name }}
      PAGES_HOSTNAME: ${{ inputs.hostname }}
      PAGES_TITLE: ${{ inputs.title }}
      PAGES_COMMENT_MARKER: ${{ inputs.comment-marker }}
      PAGES_CHECK_REVISION: ${{ inputs.check-revision }}
      DEPLOYMENT_REF: ${{ inputs.deployment-ref }}
    steps:
      - name: Require an immutable shared implementation
        run: '[[ "$DEPLOYMENT_REF" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@v7
        with:
          repository: Warsinger/cloudflare-pages-deploy
          ref: ${{ inputs.deployment-ref }}
          path: deployment-tools
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-name }}
          path: build/pages
      - name: Validate project, caller and artifact
        id: target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node deployment-tools/scripts/deploy-pages.mjs validate
      - name: Publish and report
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ github.token }}
          wranglerVersion: '4.151.1'
          packageManager: npm
          command: pages deploy build/pages --project-name ${{ inputs.project-name }} --branch ${{ steps.target.outputs.branch }} --commit-hash ${{ github.sha }} --commit-dirty=false
          postCommands: node deployment-tools/scripts/deploy-pages.mjs comment
        env:
          WRANGLER_SEND_METRICS: 'false'
